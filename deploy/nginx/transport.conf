# Nginx 설정 — 프론트(정적 파일)와 API(/api → Spring Boot 8080)를 같은 주소로 서비스한다
# 서버에서: YOUR_DOMAIN을 실제 도메인으로 바꿔 /etc/nginx/sites-available/transport 로 복사 (docs/deploy.md)
# HTTPS 인증서는 certbot(Let's Encrypt)으로 먼저 받는다

# http → https
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 30M;       # application.yml의 multipart max-request-size(30MB)와 맞춤

    root  /var/www/transport;       # frontend/dist
    index index.html;

    # 실시간 알림(SSE): 버퍼링을 끄고 연결을 오래 유지한다 (서버 heartbeat 30초)
    location /api/notifications/subscribe {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # API
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 빌드 파일(이름에 해시가 붙음)은 오래 캐시
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: 파일이 없는 경로(/admin, /customer/me ...)는 index.html로
    location / {
        try_files $uri $uri/ /index.html;
    }
}
